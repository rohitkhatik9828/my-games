<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rohit's Gaming Zone</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #1e1e2e; color: white; margin: 0; padding: 20px; }
        .btn { background: #00ffff; color: #1e1e2e; border: none; padding: 10px 20px; font-size: 16px; font-weight: bold; margin: 5px; cursor: pointer; border-radius: 25px; box-shadow: 0 4px #00bfff; }
        .btn:hover { background: #ff007f; color: white; }
        .game-section { display: none; background: #252538; padding: 20px; border-radius: 15px; max-width: 400px; margin: 20px auto; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .board { display: grid; grid-template-columns: repeat(3, 100px); gap: 5px; justify-content: center; margin-top: 15px; }
        .cell { width: 100px; height: 100px; background: #333; font-size: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 8px; font-weight: bold; }
        canvas { background: #000; display: block; margin: 15px auto; border: 2px solid #00ffff; }
        input { padding: 10px; font-size: 16px; width: 80px; text-align: center; border-radius: 5px; border: none; }
    </style>
</head>
<body>

    <h1>🎮 Rohit's Gaming Zone 🎮</h1>
    <div style="margin-bottom: 25px;">
        <button class="btn" onclick="showGame('g1')">Tic-Tac-Toe</button>
        <button class="btn" onclick="showGame('g2')">Snake Game</button>
        <button class="btn" onclick="showGame('g3')">Guessing Game</button>
        <button class="btn" onclick="showGame('g4')">🏎️ Jaguar Game</button>
    </div>

    <!-- 1. TIC TAC TOE -->
    <div id="g1" class="game-section">
        <h2>Tic-Tac-Toe</h2>
        <div class="board">
            <div class="cell" onclick="makeMove(this,0)"></div><div class="cell" onclick="makeMove(this,1)"></div><div class="cell" onclick="makeMove(this,2)"></div>
            <div class="cell" onclick="makeMove(this,3)"></div><div class="cell" onclick="makeMove(this,4)"></div><div class="cell" onclick="makeMove(this,5)"></div>
            <div class="cell" onclick="makeMove(this,6)"></div><div class="cell" onclick="makeMove(this,7)"></div><div class="cell" onclick="makeMove(this,8)"></div>
        </div>
        <p id="print">बारी: X</p>
        <button class="btn" onclick="resetTic()">Reset</button>
    </div>

    <!-- 2. SNAKE GAME -->
    <div id="g2" class="game-section">
        <h2>Snake Game</h2>
        <canvas id="stage" width="300" height="300"></canvas>
        <p id="snakeScore">स्कोर: 0</p>
    </div>

    <!-- 3. NUMBER GUESSING -->
    <div id="g3" class="game-section">
        <h2>Number Guess (1 से 20)</h2>
        <input type="number" id="guessInput" min="1" max="20" placeholder="0">
        <br><br><button class="btn" onclick="checkGuess()">Check</button>
        <p id="guessResult"></p>
    </div>

    <!-- 4. JAGUAR RACING -->
    <div id="g4" class="game-section">
        <h2>🏎️ Jaguar F-Pace Racing</h2>
        <canvas id="carCanvas" width="300" height="400"></canvas>
        <p id="carScore">स्कोर: 0</p>
        <button class="btn" onclick="initCarGame()">Restart</button>
    </div>

    <script>
        let sInt, cInt, turn='X', cells=Array(9).fill(''), gActive=true, sd="RIGHT";
        let pCar={x:130,y:310,w:44,h:65}, eCar={x:100,y:-70,w:44,h:65,speed:5}, cScore=0;

        function showGame(id) {
            document.querySelectorAll('.game-section').forEach(g=>g.style.display='none');
            let el=document.getElementById(id); if(el) el.style.display='block';
            clearInterval(sInt); clearInterval(cInt);
            if(id==='g2') initSnake(); if(id==='g4') initCarGame();
        }

        // Tic Tac Toe
        function makeMove(el, n) {
            if(cells[n]==='' && gActive) {
                cells[n]=turn; el.innerText=turn; el.style.color=turn==='X'?'#00ffff':'#ff007f';
                let wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
                if(wins.some(p=>p.every(i=>cells[i]===turn))) { document.getElementById('print').innerText="🎉 "+turn+" जीता!"; gActive=false; return; }
                if(!cells.includes('')) { document.getElementById('print').innerText="🤝 ड्रॉ!"; gActive=false; return; }
                turn=turn==='X'?'O':'X'; document.getElementById('print').innerText="बारी: "+turn;
            }
        }
        function resetTic() { cells.fill(''); document.querySelectorAll('.cell').forEach(c=>c.innerText=''); turn='X'; gActive=true; document.getElementById('print').innerText="बारी: X"; }

        // Snake Game
        function initSnake() {
            clearInterval(sInt); sd="RIGHT";
            const cv=document.getElementById('stage'), cx=cv.getContext('2d'), b=15;
            let snake=[{x:150,y:150}], score=0, food={x:75,y:75};
            document.onkeydown=e=>{
                if(e.keyCode==37 && sd!="RIGHT") sd="LEFT"; if(e.keyCode==38 && sd!="DOWN") sd="UP";
                if(e.keyCode==39 && sd!="LEFT") sd="RIGHT"; if(e.keyCode==40 && sd!="UP") sd="DOWN";
            };
            sInt=setInterval(()=>{
                cx.fillStyle='#000'; cx.fillRect(0,0,300,300);
                for(let i=0;i<snake.length;i++) { cx.fillStyle=i==0?'#00ffff':'#00bfff'; cx.fillRect(snake[i].x,snake[i].y,b-1,b-1); }
                cx.fillStyle='red'; cx.fillRect(food.x,food.y,b-1,b-1);
                let nX=snake[0].x, nY=snake[0].y;
                if(sd=="LEFT") nX-=b; if(sd=="UP") nY-=b; if(sd=="RIGHT") nX+=b; if(sd=="DOWN") nY+=b;
                if(nX==food.x && nY==food.y) { score++; document.getElementById('snakeScore').innerText="स्कोर: "+score; food={x:Math.floor(Math.random()*19)*b,y:Math.floor(Math.random()*19)*b}; } else { snake.pop(); }
                let head={x:nX,y:nY};
                if(nX<0 || nY<0 || nX>=300 || nY>=300 || snake.some(s=>s.x===head.x && s.y===head.y)) { clearInterval(sInt); alert("Game Over! स्कोर: "+score); initSnake(); return; }
                snake.unshift(head);
            },150);
        }

        // Guessing Game
        let sNum=Math.floor(Math.random()*20)+1;
        function checkGuess() {
            let g=document.getElementById('guessInput').value, r=document.getElementById('guessResult'); if(!g) return;
            if(g==sNum) { r.innerText="🎉 सही जवाब!"; sNum=Math.floor(Math.random()*20)+1; }
            else if(g>sNum) r.innerText="📉 नंबर बड़ा है!"; else r.innerText="📈 नंबर छोटा है!";
        }

        // Car Game
        function drawJaguar(cx,x,y,isP) {
            cx.fillStyle=isP?"#1a1a24":"#e53935"; cx.fillRect(x,y,44,65);
            cx.fillStyle="#111"; cx.fillRect(x+6,y+42,32,18);
            cx.fillStyle="#fff"; cx.fillRect(x+4,y+38,8,3); cx.fillRect(x+32,y+38,8,3);
            cx.fillStyle="#223"; cx.fillRect(x+5,y+12,34,18);
        }
        document.addEventListener('keydown', e=>{ if(e.keyCode==37 && pCar.x>10) pCar.x-=20; if(e.keyCode==39 && pCar.x<240) pCar.x+=20; });
        function initCarGame() {
            clearInterval(cInt); pCar.x=130; enemyReset(); cScore=0; document.getElementById('carScore').innerText="स्कोर: "+cScore;
            cInt=setInterval(()=>{
                const cv=document.getElementById('carCanvas'), cx=cv.getContext('2d'); eCar.y+=eCar.speed;
                if(eCar.y>400) { enemyReset(); cScore++; document.getElementById('carScore').innerText="स्कोर: "+cScore; if(cScore%5===0) eCar.speed+=1; }
                cx.fillStyle="#2c2c35"; cx.fillRect(0,0,300,400);
                cx.strokeStyle="#ffd700"; cx.lineWidth=2; cx.beginPath(); cx.moveTo(150,0); cx.lineTo(150,400); cx.stroke();
                drawJaguar(cx,pCar.x,pCar.y,true); drawJaguar(cx,eCar.x,eCar.y,false);
                if (pCar.x<eCar.x+eCar.w && pCar.x+pCar.w>eCar.x && pCar.y<eCar.y+eCar.h && pCar.y+pCar.h>eCar.y) { clearInterval(cInt); alert("Crash! स्कोर: "+cScore); initCarGame(); }
            },30);
        }
        function enemyReset() { eCar.y=-70; eCar.x=Math.floor(Math.random()*220)+10; eCar.speed=5; }
    </script>
</body>
</html>
